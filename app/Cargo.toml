[package]
name = "fdpick"
version = "0.1.0"
edition = "2021"
description = "fd 기반 Spotlight 스타일 경로 검색기 (Win32 네이티브 UI)"
build = "build.rs"

[dependencies]
fdpick-core = { path = "../core" }
fdpick-logic = { path = "../logic" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
