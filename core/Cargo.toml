[package]
name = "fdpick-core"
version = "0.1.0"
edition = "2021"
description = "fdpick 엔진: fd 실행, 매칭, 경로 탐색, 최근, 설정, 액션 (UI 무관)"

[dependencies]
nucleo = "0.5"
nucleo-matcher = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-segmentation = "1"

windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
