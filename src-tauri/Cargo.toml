[package]
name = "fdpick"
version = "0.1.0"
edition = "2021"
description = "fd 기반 Spotlight 스타일 경로 검색기"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nucleo = "0.5"
nucleo-matcher = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
toml = "1"
unicode-segmentation = "1"

windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
